name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Scope note: the jobs below cover this fork's own work — the H5 scripts under
# Projects/. They deliberately do NOT build or test anything under SDKs/, which
# is Infor's vendored SDK material, checked in verbatim and never modified here.
# The upstream workflow's build / odin_new / test jobs ran `cd ./cli` and
# `cd ./m3-odin`; those directories live at the repository root upstream but at
# SDKs/H5 Angular/ in this fork, so every one of those jobs failed at its first
# step on every run since the fork was restructured.

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: tsc --noEmit
        run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Vitest
        run: npm test
