# SonarCloud Automatic Analysis configuration.
#
# The quality gate failed on PR #1 with "82.3% Duplication on New Code". That
# number is an artifact of what was being analysed, not of the change:
#
#  1. Archived scripts. Moving POReceiptShortcut V1/V2/V3/V5 into archive/ gives
#     them new paths, so Sonar counts ~6,900 lines as "new code". They are
#     near-identical successive revisions of one script and of the retained V4
#     and V6, so they duplicate each other almost entirely. They are kept for
#     rollback reference only and are excluded from the build.
#
#  2. Compiled output. Every H5 script is committed as both .ts source and the
#     .js that tsc emits from it, because H5 admins deploy the .js without
#     running a build. Analysing both counts every script's logic twice.
#
#  3. Vendored material. SDKs/ is Infor's SDK checked in verbatim,
#     Projects/General/Widgets/ holds two near-identical vendor widget packages,
#     and "MI catalog and Data Dictionary/" is ~175 MB of generated M3 metadata.
#     None of it is this fork's code to fix.

sonar.exclusions=\
  SDKs/**,\
  MI catalog and Data Dictionary/**,\
  Projects/General/Widgets/**,\
  Projects/**/archive/**,\
  Projects/**/H5-Scripts/**/*.js,\
  **/*.js.map,\
  **/node_modules/**

# Compiled .js is already excluded above; this also keeps the duplication
# detector off the vendored trees if sonar.exclusions is ever relaxed.
sonar.cpd.exclusions=\
  SDKs/**,\
  Projects/General/Widgets/**,\
  Projects/**/archive/**,\
  Projects/**/H5-Scripts/**/*.js
